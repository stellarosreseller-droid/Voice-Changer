plugins {
    id 'com.android.application'
}
android {
    namespace 'com.stellaros.voicechanger'
    compileSdk 34
    defaultConfig {
        applicationId "com.stellaros.voicechanger"
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName "3.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
